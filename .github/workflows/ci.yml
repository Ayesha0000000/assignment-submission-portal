
name: CI - test, report and deploy

# Run on push to main or manual execution.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # JOB 1: Testing, reporting and email
  test:
    name: Test and report

    # Run only trusted main branch workflows.
    if: ${{ github.ref == 'refs/heads/main' }}

    # Uses the self-hosted Windows runner through CI_RUNNER variable.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    defaults:
      run:
        shell: pwsh

    steps:

      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      # Run automated tests
      - name: Run automated tests
        id: tests
        run: npm test

      # Generate JSON report even if tests fail
      - name: Build test report
        if: ${{ !cancelled() }}
        run: npm run report

      # Send report to your laptop's local receiver
      - name: Send report to local receiver
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
          RECEIVER_TOKEN: ${{ secrets.RECEIVER_TOKEN }}
        run: npm run report:send

      # Send email for passing and failing tests
      - name: Email test report
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: npm run report:email

      # Run Python receiver tests
      - name: Run receiver self-tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s tests -p "test_*.py" -v

      # Upload reports to GitHub Actions artifacts
      - name: Save test results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn

  # JOB 2: Deploy website only after successful tests
  deploy:
    name: Deploy to GitHub Pages
    needs: test

    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: pages
      cancel-in-progress: false

    steps:

      - name: Check out the code
        uses: actions/checkout@v4

      - name: Prepare static website
        run: |
          mkdir _site
          cp index.html styles.css app.js _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
