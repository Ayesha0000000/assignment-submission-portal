name: CI - test, report and deploy

# Runs on every push to any branch, on pull requests, and when started by hand.
on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: the test job can only read the code.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 - run the tests, build the JSON report, deliver it, email it
  # ---------------------------------------------------------------------------
  test:
    name: Test and report
    # Normal use: GitHub's own runner. For the "run CI locally" option, create a
    # repository variable CI_RUNNER = self-hosted (see README, section 8).
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python (for the receiver self-test)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      # If any test fails this step fails, and so does the whole job.
      # The steps below still run because they use "if: !cancelled()".
      - name: Run automated tests
        id: tests
        run: npm test

      - name: Build test-report.json from the real results
        if: ${{ !cancelled() }}
        run: npm run report

      - name: Send report to the local receiver
        if: ${{ !cancelled() }}
        continue-on-error: true          # a delivery problem must never hide the test result
        env:
          RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
          RECEIVER_TOKEN: ${{ secrets.RECEIVER_TOKEN }}
        run: npm run report:send

      - name: Email the report (optional bonus)
        if: ${{ !cancelled() }}
        continue-on-error: true          # an email problem must never hide the test result
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: npm run report:email

      - name: Run receiver self-test
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Save test results as a downloadable artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # JOB 2 - publish to GitHub Pages (bonus)
  # "needs: test" means this job runs ONLY if the test job succeeded.
  # If a test fails, this job is skipped and the old site stays online.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write        # allowed to publish to Pages
      id-token: write     # lets Pages verify the deployment came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Prepare the static site (only the public files)
        run: |
          mkdir _site
          cp index.html styles.css app.js _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
